# Supabase CLI configuration for local development.
#
# The cloud project is the source of truth for Sprint 1 (see docs/DECISIONS.md).
# This file exists so `supabase db diff`, `supabase db reset`, and type
# generation behave identically on every machine.

project_id = "project-atlas"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
schema_paths = []

[studio]
enabled = true
port = 54323

# Local mail catcher, so signup confirmation links are visible during dev.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
# Rejects passwords found in known breach corpora.
password_requirements = "lower_upper_letters_digits"
min_password_length = 12
